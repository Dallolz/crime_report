name: sport_match
description: Application de matchmaking sportif - Trouve des joueurs, joue, progresse.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0
  go_router: ^14.0.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.0
  firebase_messaging: ^14.7.0
  firebase_core: ^2.24.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  shimmer: ^3.0.0
  fl_chart: ^0.66.0
  timeago: ^3.6.0
  flutter_animate: ^4.3.0
  uuid: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.3.0
  mocktail: ^1.0.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
